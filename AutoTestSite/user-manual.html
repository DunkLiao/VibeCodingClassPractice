    <!-- ============================================
         SECTION 2: GITBOOK IFRAME
         ============================================ -->
    <section class="user-manual-section">
        <div class="gitbook-container">
            <!-- GitBook iframe with fallback -->
            <iframe 
                id="gitbookFrame"
                src="https://dunkliao.gitbook.io/my-user-manual"
                class="gitbook-iframe"
                title="產品使用手冊"
                allow="fullscreen; picture-in-picture"
                sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-presentation"
                onload="handleIframeLoad()"
                onerror="handleIframeError()">
            </iframe>
            
            <!-- Fallback content - shown when iframe fails to load -->
            <div id="iframeFallback" class="iframe-fallback hidden">
                <div class="fallback-content">
                    <i class="fas fa-book"></i>
                    <h3>產品使用手冊</h3>
                    <p>無法直接載入 GitBook 內容，請點擊下方按鈕在新頁面中查看</p>
                    <a href="https://dunkliao.gitbook.io/my-user-manual" target="_blank" class="btn btn-primary">
                        <i class="fas fa-external-link-alt"></i>
                        在新頁面打開手冊
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Quick link button -->
        <div class="container" style="margin-top: var(--spacing-2xl); text-align: center;">
            <a href="https://dunkliao.gitbook.io/my-user-manual" target="_blank" class="btn btn-secondary">

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        // Handle GitBook iframe loading
        function handleIframeLoad() {
            console.log('GitBook iframe loaded successfully');
            const fallback = document.getElementById('iframeFallback');
            if (fallback) {
                fallback.classList.add('hidden');
            }
        }

        function handleIframeError() {
            console.warn('GitBook iframe failed to load, showing fallback');
            const frame = document.getElementById('gitbookFrame');
            const fallback = document.getElementById('iframeFallback');
            if (frame) {
                frame.classList.add('hidden');
            }
            if (fallback) {
                fallback.classList.remove('hidden');
            }
        }

        // Detect iframe loading failure with timeout (as onerror may not fire for CORS issues)
        setTimeout(function() {
            try {
                const frame = document.getElementById('gitbookFrame');
                const fallback = document.getElementById('iframeFallback');
                
                // Check if iframe has content (this may not work for cross-origin frames due to CORS)
                // If iframe seems empty after 5 seconds, show fallback
                if (frame && frame.contentDocument === null) {
                    console.warn('Cross-origin iframe detected, showing fallback option');
                    frame.classList.add('hidden');
                    if (fallback) {
                        fallback.classList.remove('hidden');
                    }
                }
            } catch (e) {
                console.warn('Cross-origin iframe access restricted:', e.message);
                const frame = document.getElementById('gitbookFrame');
                const fallback = document.getElementById('iframeFallback');
                
                // For cross-origin frames, we can't detect if content loaded, so keep iframe visible
                // but make fallback available as alternative
                if (fallback) {
                    fallback.classList.add('hidden');
                }
            }
        }, 5000);
    </script>
</body>
